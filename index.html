<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snip</title>
    <!-- Шрифт Syne -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="static/style.css">

    <!-- Красно-оранжевая тема Лавовой Лампы -->
    <style>
        :root {
            /* Переопределяем цвета капель на огненно-оранжевый и лавово-красный */
            --blob-color-1: #ff4500; /* Огненно-оранжевый (Orange Red) */
            --blob-color-2: #ff7700; /* Ярко-оранжевый */
            --blob-color-3: #d00000; /* Глубокий лавовый красный */
            --blob-color-4: #ff5500; /* Насыщенный оранжевый */
        }

        .blob-1 { background: radial-gradient(circle, var(--blob-color-1) 0%, #cc2b00 100%); }
        .blob-2 { background: radial-gradient(circle, var(--blob-color-2) 0%, #ff4500 100%); }
        .blob-3 { background: radial-gradient(circle, var(--blob-color-3) 0%, #990000 100%); }
        .blob-4 { background: radial-gradient(circle, var(--blob-color-4) 0%, #e63900 100%); }
    </style>
</head>
<body>

    <!-- Эффект Лавовой Лампы (оранжево-красные капли) -->
    <div class="lava-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <!-- Минималистичная стеклянная карточка -->
    <main class="glass-card">
        <h1 class="logo">snip<span class="dot"></span></h1>

        <!-- Форма отправляет реальный POST-запрос на Go-бэкенд -->
        <form action="/" method="POST" class="form">
            <div class="input-wrapper">
                <!-- Добавлен name="url" для r.FormValue("url") -->
                <input type="url" name="url" id="urlInput" required placeholder="u link" class="glass-input">
                <button type="submit" class="btn-submit">→</button>
            </div>
        </form>

        <!-- Результат генерируется сервером Go -->
        {{if .ShortURL}}
        <div id="resultBox" class="result-box" style="display: flex;">
            <a href="{{.ShortURL}}" id="shortLink" target="_blank" class="short-url">{{.ShortURL}}</a>
            <button id="copyBtn" onclick="copyToClipboard()" class="btn-copy">Copy</button>
        </div>
        {{end}}
    </main>

    <!-- Ссылка на GitHub -->
    <footer class="github-footer">
        <a href="https://github.com/StarsMage" target="_blank" rel="noopener noreferrer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            GitHub
        </a>
    </footer>

    <script>
      function copyToClipboard() {
        const text = document.getElementById('shortLink').innerText;
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copyBtn');
        btn.innerText = 'Copied!';
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerText = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      }
    </script>
</body>
</html>
